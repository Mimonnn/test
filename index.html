<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello wrold</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; background: #f8fafc; font-family: Arial, sans-serif; }
    h1 { margin: 0; font-size: clamp(48px, 10vw, 100px); color: #111827; }
    p { margin-top: 24px; color: #64748b; font-size: 16px; }
  </style>
</head>
<body>
  <h1 id="hello">hello wrold</h1>
  <p>Naciśnij klawisz 1–9, aby zmienić kolor napisu.</p>
  <script>
    const colors = ['#111827', '#dc2626', '#ea580c', '#a16207', '#16a34a', '#0891b2', '#2563eb', '#9333ea', '#db2777'];
    document.addEventListener('keydown', (event) => {
      if (/^[1-9]$/.test(event.key)) {
        document.getElementById('hello').style.color = colors[Number(event.key) - 1];
      }
    });
  </script>
</body>
</html>
